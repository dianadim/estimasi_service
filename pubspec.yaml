name: estimasi_service
description: "Aplikasi Estimasi Service"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  url_launcher: ^6.3.2
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  shared_preferences: ^2.5.5
  pdf: ^3.12.0
  printing: ^5.14.3
  http: ^1.6.0
  file_picker: 10.3.10
  supabase_flutter: ^2.17.1
  sqflite: ^2.4.3
  path: ^1.9.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/project_estimasi.xlsx
    - assets/daihatsu_logo.png
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
