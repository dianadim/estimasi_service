name: Build APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Ambil source code
        uses: actions/checkout@v6

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Periksa versi Flutter
        run: flutter --version

      - name: Ambil dependency
        run: flutter pub get

      - name: Atur memori Gradle
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.awt.headless=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties

      - name: Build APK release
        env:
          JAVA_TOOL_OPTIONS: >-
            -Xmx4g
            -XX:MaxMetaspaceSize=1536m
            -Djava.awt.headless=true
          GRADLE_OPTS: >-
            -Dorg.gradle.vfs.watch=false
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=2
        run: flutter build apk --release --no-pub

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ECO-SA-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
